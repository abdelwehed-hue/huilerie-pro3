name: Windows local deployment validation

on:
  push:
    branches:
      - feature/offline-local-first-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows-local:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse Windows PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $files = Get-ChildItem -Path deploy/windows -Filter *.ps1 -Recurse
          if (-not $files) { throw "No Windows deployment scripts were found." }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $_" }
              throw "PowerShell parsing failed for $($file.Name)."
            }
            Write-Host "Parsed: $($file.Name)"
          }

      - name: Compile Python backend sources
        shell: powershell
        run: python -m compileall -q backend

      - name: Install frontend dependencies
        working-directory: frontend
        shell: powershell
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build local same-origin frontend
        working-directory: frontend
        shell: powershell
        run: |
          $env:VITE_API_SAME_ORIGIN = "true"
          Remove-Item Env:VITE_API_ORIGIN -ErrorAction SilentlyContinue
          npm run build
