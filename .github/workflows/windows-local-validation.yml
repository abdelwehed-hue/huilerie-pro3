name: Windows local deployment validation

on:
  push:
    branches:
      - feature/offline-local-first-foundation
      - feature/windows-exe-packaging
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-local-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-windows-local:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse Windows PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $files = Get-ChildItem -Path deploy/windows -Filter *.ps1 -Recurse
          if (-not $files) { throw "No Windows deployment scripts were found." }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $_" }
              throw "PowerShell parsing failed for $($file.Name)."
            }
            Write-Host "Parsed: $($file.Name)"
          }

      - name: Compile Python backend sources
        shell: powershell
        run: python -m compileall -q backend

      - name: Install frontend dependencies
        working-directory: frontend
        shell: powershell
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build local same-origin frontend
        working-directory: frontend
        shell: powershell
        run: |
          $env:VITE_API_SAME_ORIGIN = "true"
          Remove-Item Env:VITE_API_ORIGIN -ErrorAction SilentlyContinue
          npm run build

      - name: Install backend and Windows packaging dependencies
        shell: powershell
        run: python -m pip install -r backend/requirements-windows-build.txt

      - name: Test external app and data directory configuration
        working-directory: backend
        shell: powershell
        run: python -m pytest tests/test_windows_packaging_paths.py -q

      - name: Build frozen backend (PyInstaller onedir)
        working-directory: backend
        shell: powershell
        run: python -m PyInstaller --clean --noconfirm OroVerdeBackend.spec

      - name: Verify frozen backend and bundled Arabic fonts
        shell: powershell
        run: |
          $exe = "backend/dist/OroVerdeBackend/OroVerdeBackend.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller executable was not created: $exe" }
          if (-not (Test-Path "backend/dist/OroVerdeBackend/_internal/fonts/Amiri-Regular.ttf")) {
            throw "Arabic PDF font was not bundled."
          }

      - name: Build desktop launcher
        working-directory: backend
        shell: powershell
        run: python -m PyInstaller --clean --noconfirm OroVerdeLauncher.spec

      - name: Verify desktop launcher
        shell: powershell
        run: |
          if (-not (Test-Path "backend/dist/OroVerde.exe")) { throw "Desktop launcher was not created." }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "deploy/windows/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "release/OroVerde-Setup.exe")) { throw "Installer output missing." }

      - name: Upload Windows packaging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oroverde-windows-backend-preview
          path: |
            backend/dist/OroVerdeBackend/
            frontend/dist/
            deploy/windows/EXE-PACKAGING.md
            release/OroVerde-Setup.exe
          if-no-files-found: error
          retention-days: 7
